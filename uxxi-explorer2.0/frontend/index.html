<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Explorador UXXI · web</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <header>
        <h1>Explorador UXXI · web</h1>
        <div class="row">
            <input id="apiBase" placeholder="API base (ej: https://tu-backend.onrender.com)" />
            <button id="btnConnect">Conectar</button>
        </div>
        <p id="status" class="muted"></p>
    </header>

    <main class="grid">
        <section class="card">
            <h2>Owners</h2>
            <select id="owners"></select>
            <button id="btnLoadTables">Cargar tablas</button>
            <p id="errOwners" class="error"></p>
        </section>

        <section class="card">
            <h2>Tablas</h2>
            <input id="tableFilter" placeholder="Buscar tabla..." />
            <select id="tables" size="12"></select>
            <div class="row">
                <button id="btnColumns">Columnas</button>
                <button id="btnDDL">DDL</button>
                <button id="btnPreview">Datos</button>
            </div>
            <p id="errTables" class="error"></p>
        </section>

        <section class="card">
            <h2>Resultado</h2>
            <pre id="output"></pre>
            <p id="errOutput" class="error"></p>
        </section>
    </main>

    <script src="./app.js"></script>
</body>

</html>
